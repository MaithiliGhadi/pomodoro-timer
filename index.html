<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple Pomodoro productivity timer.">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <section class="timer-card" aria-labelledby="app-title">
      <p class="eyebrow">FOCUS • WORK • REST</p>
      <h1 id="app-title">Pomodoro Timer</h1>

      <div class="mode-switch" role="group" aria-label="Timer mode">
        <button class="mode-btn active" data-mode="work">Work</button>
        <button class="mode-btn" data-mode="shortBreak">Short Break</button>
        <button class="mode-btn" data-mode="longBreak">Long Break</button>
      </div>

      <div class="timer" aria-live="polite">
        <span id="minutes">25</span>:<span id="seconds">00</span>
      </div>

      <div class="controls">
        <button id="startBtn" class="primary-btn">Start</button>
        <button id="resetBtn" class="secondary-btn">Reset</button>
      </div>

      <p id="status" class="status">Ready to focus.</p>
      <p class="session-count">Completed sessions: <span id="sessionCount">0</span></p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
